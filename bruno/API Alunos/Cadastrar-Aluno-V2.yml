info:
  name: Cadastrar-Aluno-V2
  type: http

http:
  method: POST
  url: http://localhost:3000/alunos
  body:
    type: json
    data: |-
      {
        "nome": "Pedro",
        "curso": "ADS",
        "cpf": "12345678901"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
